<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:44px;font-weight:800;fill:#f8fafc}
      .subtitle{font-family:Inter,Arial,sans-serif;font-size:20px;fill:#cbd5e1}
      .lane{fill:rgba(255,255,255,.07);stroke:rgba(226,232,240,.18);stroke-width:1.5}
      .lane-title{font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:800;letter-spacing:.08em;fill:#bae6fd;text-transform:uppercase}
      .box{fill:#f8fafc;stroke:#dbeafe;stroke-width:1.5;filter:url(#shadow)}
      .box-dark{fill:#111827;stroke:#334155;stroke-width:1.5;filter:url(#shadow)}
      .box-title{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:800;fill:#0f172a}
      .box-title-dark{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:800;fill:#f8fafc}
      .box-text{font-family:Inter,Arial,sans-serif;font-size:15px;fill:#475569}
      .box-text-dark{font-family:Inter,Arial,sans-serif;font-size:15px;fill:#cbd5e1}
      .pill{fill:#e0f2fe}
      .pill-text{font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:700;fill:#0369a1}
      .icon{font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:900;fill:#ffffff}
      .line{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .line-soft{stroke:#64748b;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}
      .footer{font-family:Inter,Arial,sans-serif;font-size:14px;fill:#cbd5e1}
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#bg)"/>
  <rect x="44" y="42" width="1712" height="1036" rx="34" fill="rgba(15,23,42,.34)" stroke="rgba(226,232,240,.16)"/>

  <text x="90" y="112" class="title">Nexus AI Workflow OS Architecture</text>
  <text x="92" y="150" class="subtitle">Document intake to AI validation, approval, ERP delivery, reporting and audit governance</text>

  <rect x="80" y="200" width="1640" height="120" rx="22" class="lane"/>
  <text x="110" y="232" class="lane-title">Document Sources</text>

  <rect x="100" y="250" width="245" height="52" rx="14" class="box"/>
  <circle cx="128" cy="276" r="15" fill="url(#blue)"/><text x="121" y="285" class="icon">@</text>
  <text x="158" y="281" class="box-title" font-size="18">Email Inbox</text>

  <rect x="370" y="250" width="245" height="52" rx="14" class="box"/>
  <circle cx="398" cy="276" r="15" fill="url(#green)"/><text x="391" y="285" class="icon">P</text>
  <text x="428" y="281" class="box-title" font-size="18">Portal Upload</text>

  <rect x="640" y="250" width="245" height="52" rx="14" class="box"/>
  <circle cx="668" cy="276" r="15" fill="url(#purple)"/><text x="660" y="285" class="icon">API</text>
  <text x="704" y="281" class="box-title" font-size="18">API/Webhook</text>

  <rect x="910" y="250" width="245" height="52" rx="14" class="box"/>
  <circle cx="938" cy="276" r="15" fill="url(#amber)"/><text x="930" y="285" class="icon">S3</text>
  <text x="974" y="281" class="box-title" font-size="18">Cloud Storage</text>

  <rect x="1180" y="250" width="245" height="52" rx="14" class="box"/>
  <circle cx="1208" cy="276" r="15" fill="url(#blue)"/><text x="1201" y="285" class="icon">B</text>
  <text x="1238" y="281" class="box-title" font-size="18">Batch Import</text>

  <rect x="1450" y="250" width="245" height="52" rx="14" class="box"/>
  <circle cx="1478" cy="276" r="15" fill="url(#green)"/><text x="1471" y="285" class="icon">M</text>
  <text x="1508" y="281" class="box-title" font-size="18">Mobile Capture</text>

  <rect x="80" y="365" width="1640" height="230" rx="22" class="lane"/>
  <text x="110" y="397" class="lane-title">Application And Workflow Layer</text>

  <rect x="120" y="430" width="310" height="118" rx="18" class="box"/>
  <rect x="120" y="430" width="310" height="12" rx="6" fill="url(#blue)"/>
  <text x="148" y="477" class="box-title">React Dashboard</text>
  <text x="148" y="505" class="box-text">Operators view queues, health,</text>
  <text x="148" y="527" class="box-text">reviews, approvals and reports.</text>

  <rect x="500" y="430" width="310" height="118" rx="18" class="box"/>
  <rect x="500" y="430" width="310" height="12" rx="6" fill="url(#purple)"/>
  <text x="528" y="477" class="box-title">TanStack Start Router</text>
  <text x="528" y="505" class="box-text">SSR routes, app shell, module</text>
  <text x="528" y="527" class="box-text">pages and workflow screens.</text>

  <rect x="880" y="430" width="310" height="118" rx="18" class="box"/>
  <rect x="880" y="430" width="310" height="12" rx="6" fill="url(#green)"/>
  <text x="908" y="477" class="box-title">Workflow API Gateway</text>
  <text x="908" y="505" class="box-text">Receives jobs, validates payloads,</text>
  <text x="908" y="527" class="box-text">authenticates and dispatches work.</text>

  <rect x="1260" y="430" width="310" height="118" rx="18" class="box"/>
  <rect x="1260" y="430" width="310" height="12" rx="6" fill="url(#amber)"/>
  <text x="1288" y="477" class="box-title">Rules &amp; Queue Engine</text>
  <text x="1288" y="505" class="box-text">Schedules processing, retries,</text>
  <text x="1288" y="527" class="box-text">SLA checks and escalations.</text>

  <path class="line" d="M275 548 L275 630"/>
  <path class="line" d="M655 548 L655 630"/>
  <path class="line" d="M1035 548 L1035 630"/>
  <path class="line" d="M1415 548 L1415 630"/>

  <rect x="80" y="640" width="1640" height="245" rx="22" class="lane"/>
  <text x="110" y="672" class="lane-title">Intelligence Modules</text>

  <rect x="110" y="710" width="210" height="120" rx="18" class="box"/>
  <text x="138" y="750" class="box-title">Intake</text>
  <text x="138" y="779" class="box-text">Scan, normalize,</text>
  <text x="138" y="801" class="box-text">dedupe and queue.</text>

  <rect x="350" y="710" width="210" height="120" rx="18" class="box"/>
  <text x="378" y="750" class="box-title">Classify</text>
  <text x="378" y="779" class="box-text">Type, vendor, risk</text>
  <text x="378" y="801" class="box-text">and confidence.</text>

  <rect x="590" y="710" width="210" height="120" rx="18" class="box"/>
  <text x="618" y="750" class="box-title">Template</text>
  <text x="618" y="779" class="box-text">Layout detection,</text>
  <text x="618" y="801" class="box-text">field mapping.</text>

  <rect x="830" y="710" width="210" height="120" rx="18" class="box"/>
  <text x="858" y="750" class="box-title">OCR Extract</text>
  <text x="858" y="779" class="box-text">Text, tables and</text>
  <text x="858" y="801" class="box-text">line item parsing.</text>

  <rect x="1070" y="710" width="210" height="120" rx="18" class="box"/>
  <text x="1098" y="750" class="box-title">Validate</text>
  <text x="1098" y="779" class="box-text">AI checks, master</text>
  <text x="1098" y="801" class="box-text">data and review.</text>

  <rect x="1310" y="710" width="210" height="120" rx="18" class="box"/>
  <text x="1338" y="750" class="box-title">Approve</text>
  <text x="1338" y="779" class="box-text">Policy routing,</text>
  <text x="1338" y="801" class="box-text">SLA and decision.</text>

  <rect x="1550" y="710" width="145" height="120" rx="18" class="box"/>
  <text x="1578" y="750" class="box-title">Deliver</text>
  <text x="1578" y="779" class="box-text">ERP sync,</text>
  <text x="1578" y="801" class="box-text">audit, report.</text>

  <path class="line" d="M320 770 L345 770"/>
  <path class="line" d="M560 770 L585 770"/>
  <path class="line" d="M800 770 L825 770"/>
  <path class="line" d="M1040 770 L1065 770"/>
  <path class="line" d="M1280 770 L1305 770"/>
  <path class="line" d="M1520 770 L1545 770"/>

  <rect x="80" y="925" width="510" height="105" rx="22" class="lane"/>
  <text x="110" y="957" class="lane-title">Data Stores</text>
  <rect x="115" y="978" width="130" height="34" rx="10" class="pill"/><text x="135" y="1000" class="pill-text">Documents</text>
  <rect x="260" y="978" width="130" height="34" rx="10" class="pill"/><text x="282" y="1000" class="pill-text">Metadata</text>
  <rect x="405" y="978" width="140" height="34" rx="10" class="pill"/><text x="427" y="1000" class="pill-text">Audit Logs</text>

  <rect x="645" y="925" width="510" height="105" rx="22" class="lane"/>
  <text x="675" y="957" class="lane-title">External Systems</text>
  <rect x="680" y="978" width="115" height="34" rx="10" class="pill"/><text x="715" y="1000" class="pill-text">SAP</text>
  <rect x="810" y="978" width="135" height="34" rx="10" class="pill"/><text x="834" y="1000" class="pill-text">Tally/ERP</text>
  <rect x="960" y="978" width="145" height="34" rx="10" class="pill"/><text x="982" y="1000" class="pill-text">Webhooks</text>

  <rect x="1210" y="925" width="510" height="105" rx="22" class="lane"/>
  <text x="1240" y="957" class="lane-title">Security &amp; Observability</text>
  <rect x="1245" y="978" width="115" height="34" rx="10" class="pill"/><text x="1274" y="1000" class="pill-text">RBAC</text>
  <rect x="1375" y="978" width="125" height="34" rx="10" class="pill"/><text x="1398" y="1000" class="pill-text">Alerts</text>
  <rect x="1515" y="978" width="155" height="34" rx="10" class="pill"/><text x="1538" y="1000" class="pill-text">Monitoring</text>

  <path class="line-soft" d="M900 830 L335 925"/>
  <path class="line-soft" d="M1625 830 L900 925"/>
  <path class="line-soft" d="M1415 830 L1465 925"/>

  <text x="92" y="1060" class="footer">Primary flow: sources enter through intake, pass AI/OCR/review/approval, then sync to ERP with reporting and immutable audit trails.</text>
</svg>
